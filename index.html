<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virtual Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1> Virtual Pet Simulator</h1>

  <!-- Pet Setup -->
  <section id="setup">
    <h2>Create Your Pet</h2>
    <input type="text" id="petNameInput" placeholder="Pet Name">
    
    <select id="petTypeSelect">
      <option value="Bunny">Bunny</option>
      <option value="Lizard">Lizard</option>
      <option value="Dog">Dog</option>
      <option value="Cat">Cat</option>
      <option value="Parrot">Parrot</option>
      <option value="Horse">Horse</option>
    </select>

    <button onclick="createPet()">Create Pet</button>
  </section>

  <!-- Pet Display -->
  <section id="petArea" class="hidden">
    <h2 id="petName"></h2>
    <p id="petMood">Mood: 🙂</p>

    <!-- Stats -->
    <div id="stats">
      <p>Hunger: <span id="hunger"></span></p>
      <p>Happiness: <span id="happiness"></span></p>
      <p>Energy: <span id="energy"></span></p>
      <p>Health: <span id="health"></span></p>
      <p>Hygiene: <span id="hygiene"></span></p>
      <p>Money: $<span id="money"></span></p>
      <p>Total Spent: $<span id="spent"></span></p>
      <button onclick="startTrivia()">Earn Money 💰</button>
      <div id="petContainer">
     <img id="petImage" src="" alt="Your Pet">
    </div>

    <!-- Actions -->
    <div id="actions">
      <button onclick="feedPet()">Feed</button>
      <button onclick="playPet()">Play</button>
      <button onclick="restPet()">Rest</button>
      <button onclick="cleanPet()">Clean</button>
      <button onclick="vetVisit()">Vet</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>



<div id="triviaBox"></div>
<div id="popup" class="hidden"></div>

<div id="expenseBox">
  <h3>Cost of Care</h3>
  <p>Food & Supplies: $<span id="foodCost">0</span></p>
  <p>Vet Visits: $<span id="vetCost">0</span></p>
  <p>Toys & Activities: $<span id="toyCost">0</span></p>
  <hr>
  <p><strong>Total Spent:</strong> $<span id="totalSpentDisplay">0</span></p>
  <p><strong>Budget Left:</strong> $<span id="budgetDisplay">0</span></p>
</div>
